services:
  ollama:
    image: ollama/ollama:latest
    container_name: spring-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - spring-ai-network

  pgvector:
    image: pgvector/pgvector:pg17
    container_name: spring-ai-pgvector
    environment:
      POSTGRES_DB: springAiLearn
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - spring-ai-network

volumes:
  ollama_data:
  pgvector_data:

networks:
  spring-ai-network:
    driver: bridge